<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepseek – But Better</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>Deepseek <span class="accent">+</span></h1>
            <button class="settings-btn" id="settingsBtn">️</button>
        </header>

        <div class="chat" id="chat">
            <div class="message bot">
                <div class="bubble">Привет. О чём хочешь поговорить?</div>
            </div>
        </div>

        <div class="input-area">
            <textarea id="userInput" placeholder="Напиши сообщение..." rows="1"></textarea>
            <button id="sendBtn">↑</button>
        </div>

        <!-- Модалка для API ключа -->
        <div class="modal" id="settingsModal">
            <div class="modal-content">
                <h2>Настройки</h2>
                <label>API ключ Deepseek:</label>
                <input type="password" id="apiKeyInput" placeholder="sk-...">
                <div class="modal-buttons">
                    <button id="saveKey">Сохранить</button>
                    <button id="closeModal">Закрыть</button>
                </div>
                <p class="hint">Ключ сохранится локально в твоём браузере</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
  </html>
